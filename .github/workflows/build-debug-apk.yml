name: Compilar APK Debug (Game Booster)

# Activación estrictamente manual solicitada por el usuario
on:
  workflow_dispatch:
    inputs:
      enable_cache:
        description: 'Habilitar caché de dependencias y compilación de Gradle'
        required: false
        type: boolean
        default: true

jobs:
  build-debug:
    name: Compilar APK Debug con Firma Generada en Vivo
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código fuente completo del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Entorno Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Caché de Gradle (Opcional según selección)
        if: ${{ inputs.enable_cache }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 4. Asignar permisos de ejecución a scripts y wrapper
        run: |
          chmod +x gradlew
          chmod +x .github/scripts/generate_debug_keystore.sh

      - name: 5. Generar firma de depuración desde cero (Script Exclusivo)
        run: |
          ./.github/scripts/generate_debug_keystore.sh debug.keystore

      - name: 6. Compilar APK en modo Debug
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 7. Subir el APK Debug compilado como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: GameBooster-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
